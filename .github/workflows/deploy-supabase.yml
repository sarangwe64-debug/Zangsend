name: Deploy Supabase Functions

on:
  push:
    branches:
      - master
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Functions
        run: |
          supabase functions deploy find-email --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy send-email --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy create-draft --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy process-queue --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy telegram-bot --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
